services:
  openos:
    # 本地开发：docker compose up -d --build 用仓库根 Dockerfile 构建；
    # 服务器部署：CI 已推送同名镜像，compose 检测到本地镜像存在不会重新构建
    build: .
    # 镜像来源；registry/tag 由变量注入（CI 发布时传 OPENOS_TAG=v1.0.0）
    image: ${OPENOS_REGISTRY:-10.8.0.6:5000}/openos:${OPENOS_TAG:-latest}
    container_name: openos
    ports:
      # 宿主 8091：10.8.0.6 上 8081 被 auto-web(Auto Studio) 占用、8090 是 grf-bridge；
      # 容器内仍是 8081（OPENOS_ADDR 不变）
      - "8091:8081"
    volumes:
      # 运行时数据（openos.db、homes/ 用户沙箱）持久化到宿主机目录：
      # 服务器默认 /app/docker/openos；本地开发请设 OPENOS_DATA_DIR=./data（macOS 默认不共享 /app）
      - ${OPENOS_DATA_DIR:-/app/docker/openos}:/data
    environment:
      # 可选：首次启动回填 AI 配置（之后以「系统设置 → AI 服务」中的在线配置为准）
      OPENOS_AI_BASE_URL: ""
      OPENOS_AI_API_KEY: ""
      OPENOS_AI_MODEL: "glm-4-flash"
      # 生产建议设置固定密钥签发 JWT（否则首次启动自动生成并持久化在 SQLite）
      OPENOS_JWT_SECRET: ""
      # 演示部署显式开启真实终端（默认 off——安全审计 2026-10 起受限执行+环境清洗；
      # 生产/宿主形态勿开：sh -c 仍以容器内进程权限执行）
      OPENOS_REAL_SHELL: "on"
    restart: unless-stopped
