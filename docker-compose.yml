services:
  openos:
    # 本地开发：docker compose up -d --build 用仓库根 Dockerfile 构建；
    # 服务器部署：CI 已推送同名镜像，compose 检测到本地镜像存在不会重新构建
    build: .
    # 镜像来源；registry/tag 由变量注入（CI 发布时传 OPENOS_TAG=v1.0.0）
    image: ${OPENOS_REGISTRY:-10.8.0.6:5000}/openos:${OPENOS_TAG:-latest}
    container_name: openos
    ports:
      - "8081:8081"
    volumes:
      # 运行时数据（openos.db、homes/ 用户沙箱）持久化到命名卷
      - openos-data:/data
    environment:
      # 可选：首次启动回填 AI 配置（之后以「系统设置 → AI 服务」中的在线配置为准）
      OPENOS_AI_BASE_URL: ""
      OPENOS_AI_API_KEY: ""
      OPENOS_AI_MODEL: "glm-4-flash"
      # 生产建议设置固定密钥签发 JWT（否则首次启动自动生成并持久化在 SQLite）
      OPENOS_JWT_SECRET: ""
    restart: unless-stopped

volumes:
  openos-data:
