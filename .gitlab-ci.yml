# ============================================================================
# OpenOS 持续集成 / 持续交付（与 grf-gateway 同套 Runner/仓库/发布机）
# 触发方式：推送 tag（git tag v1.0.0 && git push origin v1.0.0）→ 构建/推送/部署
#           推送 main / MR → test（go test + vue-tsc，无 Docker 构建，分钟级）
# 流程：    编译打包为 Docker 镜像 -> 推送到私有仓库 -> SSH 部署到 DEPLOY_HOSTS 各主机
#           （tag 附带 dist 产物发布：多平台 openos-server 二进制 + goder 三件套 +
#            manifest.json sha256 清单 → download.gorun.fun/openos/dist/<tag>/，
#            宿主 CI 经 hostsdk/预编译消费，免每次源码编译 modernc sqlite——P7；
#            tag 同时发布桌面客户端六平台 → download.gorun.fun/openos/cli/<平台>/
#            <版本>/，平台/版本/运行文件布局，桌面客户端自动更新消费同一通道）
# 镜像仓库：10.8.0.6:5000（Registry 容器仅绑定该地址；构建/推送与发布机拉取共用）
# ============================================================================

# 同分支新流水线自动取消旧流水线（main 连推场景省 Runner 时间）
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 使用 Docker 执行器（或已挂载 /var/run/docker.sock 的执行器）
# 基础镜像：docker CLI；通过挂载的主机 Docker socket 直连守护进程
image: docker:29.7.2-cli-alpine3.24

variables:
  # 镜像仓库地址（Registry 容器仅绑定 10.8.0.6:5000，docker0 网关地址 172.17.0.1:5000 已不可达）
  REGISTRY: 10.8.0.6:5000
  # 镜像名（不含 tag）
  IMAGE_BASE: ${REGISTRY}/openos
  # 直接复用主机 Docker 守护进程（Runner 需挂载 /var/run/docker.sock:ro）
  DOCKER_HOST: unix:///var/run/docker.sock
  # Dockerfile 为多阶段构建（node → go → alpine）。Docker 23+ 默认即 BuildKit，
  # 此处显式声明，防将来基础镜像版本回退
  DOCKER_BUILDKIT: "1"
  # 发布目标主机（内网，通过 SSH 登录），多台以空格分隔
  DEPLOY_HOSTS: 10.8.0.6
  # 发布机拉取镜像的仓库地址（与构建/推送为同一仓库）
  DEPLOY_REGISTRY: ${REGISTRY}
  # 发布机上的应用工作目录
  DEPLOY_APP_DIR: /app/openos
  # SSH 登录用户
  DEPLOY_USER: root

stages:
  - test
  - build
  - push
  - deploy
  - dist

# ---- 快速验证（main / MR；容器内跑测试，具名卷跨流水线复用编译缓存） ----
test:
  stage: test
  tags:
    - docker
  script:
    # Go 单元测试（auth/bus/vfs/store/osmcp/webproxy/market）：具名卷 openos-gocache
    # 挂在 Runner 宿主上跨流水线复用（modernc sqlite 冷编译是大头）
    - docker run --rm -v "$CI_PROJECT_DIR/server:/src" -w /src -e GOPROXY=https://goproxy.cn,direct -e GOCACHE=/gocache -v openos-gocache:/gocache golang:1.26-alpine go test ./...
    # 前端类型检查（vue-tsc --noEmit 是仓库唯一前端静态校验）
    - docker run --rm -v "$CI_PROJECT_DIR/web:/web" -w /web -v openos-npmcache:/npmcache -e npm_config_cache=/npmcache node:22-alpine sh -c "npm install --no-audit --no-fund && npm run typecheck"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 多阶段 Dockerfile 内已完成：前端构建（Vite/Vue3）-> 后端编译（Go 纯静态）-> 精简运行镜像打包
# goder 源码与 gh 发行版在构建前取进上下文（.run/，Dockerfile 以 COPY 消费）：
# 不能在镜像层内 clone/下载——RUN 层缓存键只认命令字符串，上游 goder/gh 前进
# 而缓存不失效，会锁死旧快照（grf-hotel v0.0.8/v0.0.9 的教训，同款处理）
build-image:
  stage: build
  tags:
    - docker
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache git curl
    - mkdir -p .run
    - git clone --depth 1 https://git.gorun.fun/share/goder.git .run/goder-src
    # gh：取 grf-harness 最新发布版（目录结构 {平台}/{版本}/gh；CI 容器架构
    # 与构建平台同为 runner 宿主机，uname 即目标架构）。版本择新复用 goder
    # scripts/version.sh gh——正式版 > 同基线预发布、postN 自然序；sort -V
    # 两点都会排错（见 goder internal/desktop/version.go 的说明），脚本固定
    # 按 macos-arm64 目录列版本（各平台版本号一致）
    - |
      PLAT=$([ "$(uname -m)" = aarch64 ] && echo linux-arm64 || echo linux)
      VER=$(sh .run/goder-src/scripts/version.sh gh)
      echo "下载 gh ${VER} (${PLAT})"
      curl -fsSL -o .run/gh "https://download.gorun.fun/grf-harness/${PLAT}/${VER}/gh"
      chmod +x .run/gh && .run/gh --version
  script:
    - docker info
    # APP_VERSION 注入服务端版本号（系统信息/健康检查显示 git tag）
    - docker build --build-arg APP_VERSION=${CI_COMMIT_TAG} -t ${IMAGE_BASE}:${CI_COMMIT_TAG} .
    - docker history ${IMAGE_BASE}:${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG'      # 仅打 tag 触发

push-image:
  stage: push
  tags:
    - docker
  # 内网仓库（10.8.0.6:5000）不启用认证，无需 login
  script:
    - docker push ${IMAGE_BASE}:${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG'

# 发布到 DEPLOY_HOSTS 各主机（bridge 网络映射宿主 8091 → 容器 8081），复用项目 docker-compose.yml，
# 从内网仓库拉取镜像（服务器上已有同名镜像，compose 不会触发本地 build）
deploy:
  stage: deploy
  tags:
    - docker
  # SSH 登录发布主机，需配置 CI/CD 变量：
  #   DEPLOY_USER            （发布机 SSH 用户名）
  #   DEPLOY_SSH_PRIVATE_KEY （发布机 SSH 私钥）
  before_script:
    # 使用国内 Alpine 源加速，并安装 ssh/scp（docker CLI 镜像不自带）
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # DEPLOY_SSH_PRIVATE_KEY 为文件类型变量，内容已在 $CI_PROJECT_DIR/$DEPLOY_SSH_PRIVATE_KEY
    # （运行时其值是该文件路径），复制到预期位置并清权限
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${DEPLOY_HOSTS// / } >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # 逐台部署：拷贝 docker-compose.yml，从内网仓库拉取镜像并按仓库内配置更新容器
    # 运行数据持久化在宿主机 /app/docker/openos（bind mount → /data），跨升级保留
    - |
      for HOST in ${DEPLOY_HOSTS}; do
        echo "===== 部署到 ${HOST} ====="
        ssh ${DEPLOY_USER}@${HOST} "mkdir -p ${DEPLOY_APP_DIR}"
        scp docker-compose.yml ${DEPLOY_USER}@${HOST}:${DEPLOY_APP_DIR}/docker-compose.yml
        ssh ${DEPLOY_USER}@${HOST} "cd ${DEPLOY_APP_DIR} && OPENOS_REGISTRY=${DEPLOY_REGISTRY} OPENOS_TAG=${CI_COMMIT_TAG} docker compose pull && OPENOS_REGISTRY=${DEPLOY_REGISTRY} OPENOS_TAG=${CI_COMMIT_TAG} docker compose up -d --force-recreate"
        # 部署完成后清理本应用旧镜像，避免占满磁盘：只删 openos 仓库中
        # 非当前版本的 tag；rmi 不带 -f，仍被其他容器占用的镜像会被拒绝，不动其他应用
        ssh ${DEPLOY_USER}@${HOST} "docker images --format '{{.Repository}}:{{.Tag}}' ${DEPLOY_REGISTRY}/openos | grep -v ':${CI_COMMIT_TAG}\$' | xargs -r docker rmi || true"
      done
  rules:
    - if: '$CI_COMMIT_TAG'

# ---- dist 产物发布（tag；宿主预编译消费通道，P7） ----
# 多平台 openos-server 二进制（darwin/linux × amd64/arm64，CGO_ENABLED=0）+
# goder 三件套（goder-serve/goder.js/gh，从当次镜像提取，与部署产物严格同源）+
# manifest.json（各文件 sha256）→ scp 到 10.8.0.5:/data/download/openos/dist/<tag>/。
# 宿主 CI/ensure 脚本按 tag 下载（校验 sha256）替代源码编译 openos-server。
publish-dist:
  stage: dist
  tags:
    - docker
  needs: ["push-image"]
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 10.8.0.5 >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - mkdir -p dist-out
    # 1) 多平台服务端二进制（版本号注入；Go 具名卷缓存）
    - |
      for GOOS in darwin linux; do
        for GOARCH in amd64 arm64; do
          docker run --rm -v "$CI_PROJECT_DIR:/work" -w /work/server -e GOPROXY=https://goproxy.cn,direct -e GOCACHE=/gocache -v openos-gocache:/gocache -e GOOS=$GOOS -e GOARCH=$GOARCH -e CGO_ENABLED=0 golang:1.26-alpine go build -trimpath -ldflags "-s -w -X openos/server/internal/store.Version=${CI_COMMIT_TAG}" -o /work/dist-out/openos-server-${GOOS}-${GOARCH} .
        done
      done
    # 2) goder 三件套：从当次构建镜像提取（与部署产物同源，不再单独构建）
    - docker create --name osdist ${IMAGE_BASE}:${CI_COMMIT_TAG} || true
    - docker cp osdist:/app/goder/goder-serve dist-out/goder-serve 2>/dev/null || true
    - docker cp osdist:/app/goder/goder.js dist-out/goder.js 2>/dev/null || true
    - docker cp osdist:/app/goder/gh dist-out/gh 2>/dev/null || true
    - docker rm -f osdist >/dev/null 2>&1 || true
    # 3) manifest.json（sha256 清单；宿主下载后必校验）。注意子 shell 内 cd：
    #    GitLab CI 的 script 各行共用同一 shell，cd dist-out 泄漏会让下一步
    #    scp dist-out/* 找不到文件（P7 起的隐藏 bug，被 runner 挂载问题掩盖）
    - |
      ( cd dist-out && { echo '{'; FIRST=1
      for f in *; do
        [ "$f" = manifest.json ] && continue
        [ $FIRST = 1 ] || echo ','
        printf '  "%s": "%s"' "$f" "$(sha256sum "$f" | cut -d" " -f1)"
        FIRST=0
      done; echo; echo '}'; } > manifest.json && cat manifest.json )
    # 4) 上传（货架机同源：download.gorun.fun = 10.8.0.5:/data/download）
    - ssh ${DEPLOY_USER}@10.8.0.5 "mkdir -p /data/download/openos/dist/${CI_COMMIT_TAG}"
    - scp dist-out/* ${DEPLOY_USER}@10.8.0.5:/data/download/openos/dist/${CI_COMMIT_TAG}/
  rules:
    - if: '$CI_COMMIT_TAG'

# ---- 桌面客户端发布（tag；download.gorun.fun/openos/cli 通道） ----
# 交叉编译全部 6 平台（darwin/linux/windows × amd64/arm64，平台目录沿用 goder
# 约定：macos=amd64、macos-arm64、linux、linux-arm64、windows、windows-arm64；
# Windows 构建 GUI 子系统 + rsrc 图标）→ 版本注入（tag 去 v 前缀）+ .sha256 校验
# 文件 + notes.txt（发布说明）→ 上传 10.8.0.5:/data/download/openos/cli/<平台>/
# <版本>/。布局 = 平台/版本/运行文件（goder 同款）；桌面客户端的自动更新
#（desktop/update.go）消费同一通道。本地等价命令：make desktop-upload。
publish-cli:
  stage: dist
  tags:
    - docker
  needs: ["push-image"]
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 10.8.0.5 >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - VER="${CI_COMMIT_TAG#v}"
    - mkdir -p cli-out
    # 1) 六平台交叉编译（纯 Go，CGO_ENABLED=0；具名卷跨流水线复用编译缓存）
    - |
      for T in "darwin amd64 macos" "darwin arm64 macos-arm64" "linux amd64 linux" \
               "linux arm64 linux-arm64" "windows amd64 windows" "windows arm64 windows-arm64"; do
        set -- $T; GOOS=$1; GOARCH=$2; PLAT=$3; EXT=""; LD="-s -w -X main.version=${VER}"
        [ "$GOOS" = windows ] && { EXT=".exe"; LD="$LD -H windowsgui"; }
        echo "→ 构建 openos-desktop-${PLAT}${EXT} (${GOOS}/${GOARCH})"
        mkdir -p cli-out/${PLAT}
        docker run --rm -v "$CI_PROJECT_DIR:/work" -w /work/desktop \
          -e GOPROXY=https://goproxy.cn,direct -e GOCACHE=/gocache -v openos-gocache:/gocache \
          -e CGO_ENABLED=0 -e GOOS=$GOOS -e GOARCH=$GOARCH \
          golang:1.26-alpine go build -trimpath -ldflags "$LD" \
          -o /work/cli-out/${PLAT}/openos-desktop-${PLAT}${EXT} .
      done
    # 2) sha256 校验文件 + notes.txt（发布说明 = tag 提交信息）；跳过已生成的
    #    .sha256 文件，防重复执行产出 .sha256.sha256
    - |
      for f in cli-out/*/openos-desktop-*; do
        case "$f" in *.sha256) continue ;; esac
        sha256sum "$f" > "$f.sha256"
      done
      git log -1 --pretty=%B > cli-out/notes.txt
      cat cli-out/notes.txt
    # 3) 上传（download.gorun.fun = 10.8.0.5:/data/download）
    - |
      for PLAT in macos macos-arm64 linux linux-arm64 windows windows-arm64; do
        ssh ${DEPLOY_USER}@10.8.0.5 "mkdir -p /data/download/openos/cli/${PLAT}/${VER}"
        scp cli-out/${PLAT}/* ${DEPLOY_USER}@10.8.0.5:/data/download/openos/cli/${PLAT}/${VER}/
        scp cli-out/notes.txt ${DEPLOY_USER}@10.8.0.5:/data/download/openos/cli/${PLAT}/${VER}/notes.txt
      done
  rules:
    - if: '$CI_COMMIT_TAG'
